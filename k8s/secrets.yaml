# ── stableflow-secrets ────────────────────────────────────────────────────────
# All values are base64-encoded. The deploy script regenerates this file from
# plaintext env vars so the committed version only contains safe defaults for
# local Minikube use. Never commit real credentials here.
#
# To regenerate manually:
#   echo -n 'stableflow' | base64   →  c3RhYmxlZmxvdw==
#
# API key defaults (dev-key-payment-service / dev-key-admin) are for local
# development only. Replace before exposing the gateway outside localhost.
apiVersion: v1
kind: Secret
metadata:
  name: stableflow-secrets
  namespace: stableflow
type: Opaque
data:
  # postgres credentials — "stableflow" / "stableflow"
  postgres-user:     c3RhYmxlZmxvdw==
  postgres-password: c3RhYmxlZmxvdw==
  # gateway API keys — "dev-key-payment-service" / "dev-key-admin"
  gateway-api-key-1: ZGV2LWtleS1wYXltZW50LXNlcnZpY2U=
  gateway-api-key-2: ZGV2LWtleS1hZG1pbg==
