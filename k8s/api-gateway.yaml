apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stableflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: docker.io/library/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8081
            - name: WALLET_SERVICE_URL
              value: http://wallet-service:8082
            - name: BLOCKCHAIN_SERVICE_URL
              value: http://blockchain-service:8083
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8084
            - name: GATEWAY_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: stableflow-secrets
                  key: gateway-api-key-1
            - name: GATEWAY_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: stableflow-secrets
                  key: gateway-api-key-2
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
---
# NodePort exposes the gateway on a stable port on the Minikube VM IP.
# Run `minikube service api-gateway -n stableflow --url` to get the URL.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: stableflow
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
