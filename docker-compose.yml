services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stableflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stableflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stableflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stableflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stableflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stableflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stableflow}
      SPRING_RABBITMQ_HOST: rabbitmq
      WALLET_SERVICE_URL: http://wallet-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  blockchain-service:
    build:
      context: .
      dockerfile: blockchain-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/blockchain_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stableflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stableflow}
      SPRING_RABBITMQ_HOST: rabbitmq
      BLOCKCHAIN_SIMULATION_MODE: ${BLOCKCHAIN_SIMULATION_MODE:-success}
      BLOCKCHAIN_SIMULATION_DELAY_MS: ${BLOCKCHAIN_SIMULATION_DELAY_MS:-250}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stableflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stableflow}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      PAYMENT_SERVICE_URL: http://payment-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      payment-service:
        condition: service_healthy
      blockchain-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
