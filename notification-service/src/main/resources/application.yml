server:
  port: ${SERVER_PORT:8084}

spring:
  application.name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:stableflow}
    password: ${SPRING_DATASOURCE_PASSWORD:stableflow}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  flyway.enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints.web.exposure.include: health,info
